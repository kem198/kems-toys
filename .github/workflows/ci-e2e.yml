name: CI - End-to-End

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Node.js version from package.json (Volta / engines fallback)
        run: |
          NODE_VERSION=$(jq -r '.volta.node // .engines.node // "lts/*"' package.json)
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Frontend
        run: npm run build

      - name: Start Frontend
        run: npm start &

      - name: Wait for server
        run: timeout 60 bash -c 'until curl -fsS http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
